name: Tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Upgrade Yarn
        run: |
          corepack enable
          yarn set version stable

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install

      - run: yarn test
